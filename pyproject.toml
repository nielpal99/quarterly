[project]
name = "quarterly"
version = "0.9.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.163.1",
    "llama-cloud>=2.19.0",
    "openai>=3.51.0",
    "pillow>=13.0.0",
    "pypdf>=7.1.0",
    "pypdfium2>=5.15.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
